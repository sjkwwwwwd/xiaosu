<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小黍</title>
<link rel="icon" href="/static/avatar.png" />
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #17181c;
    --muted: #6b7280;
    --border: #e6e8ec;
    --accent: #2f6bff;
    --accent-soft: #eef3ff;
    --hover: #f4f6f9;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }
  img { -webkit-user-drag: none; }

  /* ---------- 顶栏 ---------- */
  header {
    height: 58px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px;
    background: rgba(255,255,255,.86); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; flex: 0 0 auto; }
  .brand h1 { font-size: 15px; font-weight: 600; margin: 0; }
  .brand small { display: block; font-size: 11px; color: var(--muted); font-weight: 400; margin-top: 1px; }
  .btn-ghost {
    font-size: 12.5px; color: var(--muted); background: transparent;
    border: 1px solid var(--border); padding: 6px 12px; border-radius: 999px; cursor: pointer;
  }
  .btn-ghost:hover { color: var(--text); background: var(--hover); }

  /* ---------- 消息区 ---------- */
  main { flex: 1 1 auto; overflow-y: auto; }
  .wrap { max-width: 780px; margin: 0 auto; padding: 26px 20px 12px; }

  .welcome { text-align: center; padding: 40px 0 20px; }
  .welcome .big {
    width: 78px; height: 78px; border-radius: 50%; margin: 0 auto 16px;
    overflow: hidden; box-shadow: 0 10px 28px rgba(47,107,255,.22);
    border: 2px solid #fff;
  }
  .welcome .big img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .welcome h2 { font-size: 20px; margin: 0 0 8px; font-weight: 600; }
  .welcome p { font-size: 13.5px; color: var(--muted); margin: 0 0 8px; line-height: 1.7; }
  .tagline {
    display: inline-block; font-size: 12px; color: var(--accent);
    background: var(--accent-soft); border: 1px solid #dbe5ff;
    padding: 4px 10px; border-radius: 999px; margin-bottom: 22px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; }
  .chip {
    font-size: 13px; color: #364152; background: #fff;
    border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 14px; cursor: pointer; transition: .15s;
  }
  .chip:hover { border-color: #c9d5ff; background: var(--accent-soft); color: var(--accent); }

  .row { display: flex; gap: 11px; margin: 22px 0; animation: rise .28s ease both; }
  .row.user { flex-direction: row-reverse; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .avatar {
    width: 30px; height: 30px; border-radius: 50%; flex: 0 0 auto;
    margin-top: 2px; overflow: hidden; border: 1px solid var(--border); background: #fff;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar.me { background: #e9ecf2; color: #4b5563; display: grid; place-items: center; font-size: 12px; border-color: transparent; }

  .bubble {
    max-width: min(78%, 560px); font-size: 14.5px; line-height: 1.75;
    padding: 11px 15px; border-radius: 14px;
    white-space: pre-wrap; word-break: break-word;
  }
  .row.user .bubble {
    background: var(--accent); color: #fff; border-top-right-radius: 5px;
    box-shadow: 0 2px 10px rgba(47,107,255,.22);
  }
  .row.ai .bubble {
    background: #fff; color: var(--text); border: 1px solid var(--border);
    border-top-left-radius: 5px; box-shadow: 0 1px 3px rgba(16,24,40,.04);
  }
  .err { color: #b42318; background: #fef3f2 !important; border-color: #fecdca !important; }
  .err button.link {
    color: #b42318; font-weight: 600; text-decoration: underline;
    background: none; border: none; padding: 0; cursor: pointer; font-size: inherit;
  }
  .cursor {
    display: inline-block; width: 2px; height: 15px; margin-left: 2px;
    background: var(--accent); vertical-align: -2px; animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .thinking { display: flex; gap: 4px; padding: 4px 2px; }
  .thinking i {
    width: 6px; height: 6px; border-radius: 50%; background: #b8c0cc;
    animation: jump 1.2s infinite ease-in-out;
  }
  .thinking i:nth-child(2) { animation-delay: .15s; }
  .thinking i:nth-child(3) { animation-delay: .3s; }
  @keyframes jump { 0%,60%,100% { transform: translateY(0); opacity: .55; } 30% { transform: translateY(-4px); opacity: 1; } }

  /* ---------- 输入区 ---------- */
  footer { flex: 0 0 auto; position: relative; padding: 10px 20px 20px; }
  .composer {
    max-width: 780px; margin: 0 auto; background: #fff;
    border: 1px solid var(--border); border-radius: 16px;
    padding: 10px 10px 10px 16px; display: flex; align-items: flex-end; gap: 10px;
    box-shadow: 0 4px 18px rgba(16,24,40,.05); transition: .15s;
  }
  .composer:focus-within { border-color: #c1d0ff; box-shadow: 0 4px 22px rgba(47,107,255,.12); }
  textarea {
    flex: 1; border: none; outline: none; resize: none; font: inherit;
    font-size: 14.5px; line-height: 1.6; max-height: 150px; padding: 6px 0;
    background: transparent; color: var(--text);
  }
  textarea::placeholder { color: #9aa3b2; }
  .send {
    width: 34px; height: 34px; border-radius: 10px; border: none; flex: 0 0 auto;
    background: var(--accent); color: #fff; cursor: pointer;
    display: grid; place-items: center; transition: .15s;
  }
  .send:hover:not(:disabled) { background: #1d57e6; }
  .send:disabled { background: #d5dbe6; cursor: not-allowed; }
  .hint { max-width: 780px; margin: 9px auto 0; font-size: 11.5px; color: #9aa3b2; text-align: center; }

  /* ---------- 左下角：会话 + 小黍设置 ---------- */
  .dock {
    position: absolute; left: 16px; bottom: 16px; z-index: 30;
    display: flex; align-items: center; gap: 8px;
  }
  .dock-btn {
    height: 42px; padding: 0 14px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 7px;
    background: #fff; border: 1px solid var(--border); cursor: pointer;
    box-shadow: 0 2px 10px rgba(16,24,40,.07); transition: .16s;
    font-size: 12.5px; color: #364152; white-space: nowrap;
  }
  .dock-btn:hover { border-color: #c9d5ff; background: #fcfdff; }
  .dock-btn.on { border-color: #b9caff; background: var(--accent-soft); color: var(--accent); }
  .profile {
    height: 42px;
    display: flex; align-items: center; gap: 9px;
    padding: 0 11px 0 6px; border-radius: 999px;
    background: #fff; border: 1px solid var(--border); cursor: pointer;
    box-shadow: 0 2px 10px rgba(16,24,40,.07); transition: .16s;
    max-width: 220px;
  }
  .profile:hover { border-color: #c9d5ff; background: #fcfdff; }
  .profile.on { border-color: #b9caff; box-shadow: 0 6px 20px rgba(47,107,255,.18); }
  .profile .p-av {
    width: 30px; height: 30px; border-radius: 50%; object-fit: cover; flex: 0 0 auto;
  }
  .profile .p-meta { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; line-height: 1.25; }
  .profile .p-name { font-size: 12.5px; font-weight: 600; color: var(--text); }
  .profile .p-model {
    font-size: 10.5px; color: var(--muted); max-width: 140px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .profile .chev { color: #98a2b3; flex: 0 0 auto; transition: transform .18s; }
  .profile.on .chev { transform: rotate(180deg); }

  /* ---------- 设置面板 ---------- */
  .pop {
    position: absolute; left: 0; bottom: calc(100% + 12px); width: 352px;
    max-width: calc(100vw - 32px);
    background: #fff; border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 18px 48px rgba(16,24,40,.16);
    z-index: 60; overflow: hidden;
    opacity: 0; transform: translateY(8px) scale(.98); pointer-events: none;
    transform-origin: left bottom; transition: opacity .16s, transform .16s;
  }
  .pop.on { opacity: 1; transform: none; pointer-events: auto; }

  .pop-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 14px 11px 16px; border-bottom: 1px solid var(--border);
  }
  .pop-head b { font-size: 13px; font-weight: 600; }
  .pop-head .x {
    width: 26px; height: 26px; border-radius: 7px; border: none; background: transparent;
    color: var(--muted); font-size: 15px; line-height: 1; cursor: pointer;
  }
  .pop-head .x:hover { background: var(--hover); }

  .pop-body { max-height: min(60vh, 460px); overflow-y: auto; padding: 8px; }

  .opt {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px;
    border-radius: 9px; cursor: pointer; transition: background .13s;
  }
  .opt:hover { background: var(--hover); }
  .opt.on { background: var(--accent-soft); }
  .opt .radio {
    width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid #cfd6e2;
    flex: 0 0 auto; position: relative; transition: .15s;
  }
  .opt.on .radio { border-color: var(--accent); }
  .opt.on .radio::after {
    content: ""; position: absolute; inset: 2.5px; border-radius: 50%; background: var(--accent);
  }
  .opt .txt { flex: 1; min-width: 0; }
  .opt .txt b { display: block; font-size: 13px; font-weight: 500; color: var(--text); }
  .opt .txt span { display: block; font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  .opt .cur {
    font-size: 10.5px; color: var(--muted); max-width: 96px; text-align: right;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 0 0 auto;
  }

  .forms { padding: 6px 10px 10px 35px; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 11.5px; color: #4b5563; margin-bottom: 5px; }
  .field input, .field select {
    width: 100%; font-size: 12.5px; font-family: inherit; color: var(--text);
    padding: 7px 9px; border: 1px solid var(--border); border-radius: 8px;
    background: #fff; outline: none; transition: .15s;
  }
  .field input:focus, .field select:focus { border-color: #c1d0ff; box-shadow: 0 0 0 3px rgba(47,107,255,.10); }
  .field input::placeholder { color: #b6bdc9; }
  .row-inline { display: flex; gap: 6px; }
  .row-inline > input, .row-inline > select { flex: 1; min-width: 0; }
  .mini {
    font-size: 11.5px; padding: 7px 10px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--border); background: #fff; color: #374151; white-space: nowrap; flex: 0 0 auto;
  }
  .mini:hover { background: var(--hover); }
  .mini:disabled { opacity: .55; cursor: not-allowed; }

  .tip {
    font-size: 11.5px; line-height: 1.65; color: #475467;
    background: #f8f9fb; border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 11px; margin: 2px 0 10px;
  }
  .tip a { color: var(--accent); }

  .pop-foot { padding: 10px 14px 13px; border-top: 1px solid var(--border); }
  .primary {
    width: 100%; padding: 9px; border-radius: 9px; border: none;
    background: var(--accent); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .primary:hover { background: #1d57e6; }
  .status { font-size: 11.5px; margin-top: 7px; min-height: 15px; text-align: center; }
  .status.ok { color: #067647; }
  .status.bad { color: #b42318; }

  /* 会话列表 */
  .pop-threads { width: 306px; }
  .thread-list { max-height: 348px; overflow-y: auto; padding: 6px; }
  .thread-item {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 10px; border-radius: 9px; cursor: pointer; transition: background .13s;
  }
  .thread-item:hover { background: var(--hover); }
  .thread-item.active { background: var(--accent-soft); }
  .thread-item .t-txt { flex: 1; min-width: 0; }
  .thread-item .t-title {
    display: block; font-size: 12.5px; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .thread-item.active .t-title { color: var(--accent); font-weight: 500; }
  .thread-item .t-time { display: block; font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .thread-item .t-del {
    width: 22px; height: 22px; flex: 0 0 auto; border: none; border-radius: 6px;
    background: transparent; color: #98a2b3; font-size: 14px; line-height: 1;
    cursor: pointer; opacity: 0; transition: .13s;
  }
  .thread-item:hover .t-del { opacity: 1; }
  .thread-item .t-del:hover { background: #fee4e2; color: #b42318; }
  .empty { font-size: 12px; color: var(--muted); text-align: center; padding: 26px 0; }

  .hidden { display: none !important; }

  @media (max-width: 900px) {
    footer { padding-left: 118px; }
    .dock-btn { padding: 0 12px; }
    .dock-btn span { display: none; }
    .profile { padding: 0 6px; }
    .profile .p-meta, .profile .chev { display: none; }
  }
  @media (max-width: 560px) {
    .wrap { padding: 16px 14px 8px; }
    .bubble { max-width: 84%; }
    .brand small { display: none; }
    .pop { width: calc(100vw - 32px); }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="/static/avatar.gif" alt="小黍" />
    <div>
      <h1>小黍</h1>
      <small>LangGraph · 多轮记忆 · 流式输出</small>
    </div>
  </div>
  <button class="btn-ghost" id="resetBtn">新会话</button>
</header>

<main id="main">
  <div class="wrap" id="wrap">
    <div class="welcome" id="welcome">
      <div class="big"><img src="/static/avatar.gif" alt="小黍" /></div>
      <h2>我是小黍</h2>
      <p>打开就能聊，内置免费模型，不需要任何配置。</p>
      <div class="tagline" id="tagline">正在检测可用模型…</div>
      <div class="chips">
        <button class="chip">你是谁？</button>
        <button class="chip">LangGraph 和 LangChain 有什么区别？</button>
        <button class="chip">帮我写个 Python 冒泡排序</button>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="和小黍聊聊…（Enter 发送，Shift + Enter 换行）"></textarea>
    <button class="send" id="sendBtn" title="发送">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/>
      </svg>
    </button>
  </div>
  <div class="hint">对话由大模型生成，请注意甄别。密钥只存在你本机浏览器里。</div>

  <!-- 左下角：会话列表 + 模型设置 -->
  <div class="dock">
    <button class="dock-btn" id="threadsBtn" title="历史会话">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <span>会话</span>
    </button>
    <button class="profile" id="profileBtn" title="模型设置">
    <img class="p-av" src="/static/avatar.gif" alt="小黍" />
    <div class="p-meta">
      <span class="p-name">小黍</span>
      <span class="p-model" id="pModel">加载中</span>
    </div>
    <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="m18 15-6-6-6 6"/>
    </svg>
  </button>

  <!-- 设置面板 -->
  <div class="pop" id="pop">
    <div class="pop-head">
      <b>模型设置</b>
      <button class="x" id="closePop">×</button>
    </div>
    <div class="pop-body">
      <div class="opt on" data-kind="free">
        <div class="radio"></div>
        <div class="txt"><b>内置免费</b><span>开箱即用，无需密钥</span></div>
        <div class="cur" id="curFree">gpt-oss-20b</div>
      </div>
      <div class="forms" id="form-free">
        <div class="tip">
          公共免费接口，支持多轮与流式，约 <b>4 次/分钟</b>。稳定性不保证，正式使用建议换成自己的 API。
        </div>
      </div>

      <div class="opt" data-kind="openai">
        <div class="radio"></div>
        <div class="txt"><b>自定义 API</b><span>DeepSeek / 硅基流动 / OpenRouter…</span></div>
        <div class="cur" id="curOpenai"></div>
      </div>
      <div class="forms hidden" id="form-openai">
        <div class="field">
          <label>服务商预设</label>
          <select id="presetSelect"><option value="">— 手动填写 —</option></select>
        </div>
        <div class="field">
          <label>接口地址（含 /v1）</label>
          <input id="baseUrl" placeholder="https://api.deepseek.com/v1" autocomplete="off" spellcheck="false" />
        </div>
        <div class="field">
          <label>API Key</label>
          <input id="apiKey" type="password" placeholder="sk-..." autocomplete="off" spellcheck="false" />
        </div>
        <div class="field">
          <label>模型名</label>
          <div class="row-inline">
            <input id="modelNameInput" placeholder="deepseek-chat" autocomplete="off" spellcheck="false" />
            <button class="mini" id="fetchModels">拉取</button>
          </div>
        </div>
        <div class="field hidden" id="modelListWrap">
          <label>检测到的模型</label>
          <select id="modelSelect"></select>
        </div>
        <div class="tip" id="presetHint"></div>
      </div>

      <div class="opt" data-kind="ollama">
        <div class="radio"></div>
        <div class="txt"><b>本地 Ollama</b><span>免费不限次数，跑在自己电脑</span></div>
        <div class="cur" id="curOllama"></div>
      </div>
      <div class="forms hidden" id="form-ollama">
        <div class="field">
          <label>服务地址</label>
          <input id="ollamaUrl" value="http://127.0.0.1:11434" autocomplete="off" spellcheck="false" />
        </div>
        <div class="field">
          <label>已安装的模型</label>
          <div class="row-inline">
            <select id="ollamaModels"><option value="">先点检测</option></select>
            <button class="mini" id="detectOllama">检测</button>
          </div>
        </div>
        <div class="tip">
          没装的话去 <a href="https://ollama.com/download" target="_blank" rel="noopener">ollama.com</a> 安装，
          再执行 <b>ollama pull qwen2.5:3b</b>。
        </div>
      </div>
    </div>
    <div class="pop-foot">
      <button class="primary" id="saveBtn">保存并使用</button>
      <div class="status" id="statusMsg"></div>
    </div>
  </div>

    <!-- 会话列表面板 -->
    <div class="pop pop-threads" id="threadsPop">
      <div class="pop-head">
        <b>会话记录</b>
        <button class="x" id="closeThreads">×</button>
      </div>
      <div class="thread-list" id="threadList"></div>
    </div>
  </div>
</footer>

<script>
const $ = id => document.getElementById(id);
const main = $('main'), wrap = $('wrap'), input = $('input'), sendBtn = $('sendBtn');
const pop = $('pop'), profileBtn = $('profileBtn'), statusMsg = $('statusMsg');
const threadsPop = $('threadsPop'), threadsBtn = $('threadsBtn');
// 记住欢迎页的原始结构，新会话/切回空会话时用它还原
const WELCOME_HTML = wrap.innerHTML;

let threadId = localStorage.getItem('chat_thread_id');
if (!threadId) {
  threadId = (crypto.randomUUID ? crypto.randomUUID() : 'thread-' + Date.now() + '-' + Math.random().toString(16).slice(2));
  localStorage.setItem('chat_thread_id', threadId);
}

const DEFAULT_PROVIDER = { kind: 'free', base_url: '', api_key: '', model: '', temperature: 0.7 };
let provider = Object.assign({}, DEFAULT_PROVIDER,
  JSON.parse(localStorage.getItem('chat_provider') || 'null') || {});
let editing = Object.assign({}, provider);
let presets = [];
let busy = false;

/* ---------- 通道显示 ---------- */
function shortModel(p) {
  if (p.kind === 'free') return 'gpt-oss-20b';
  if (p.kind === 'ollama') return p.model || '未选模型';
  return p.model || '未配置';
}
function refreshBadge() {
  $('pModel').textContent = provider.kind === 'free' ? '内置免费'
    : provider.kind === 'ollama' ? ('本地 · ' + (provider.model || '未选')) : (provider.model || '自定义 API');
  $('curOpenai').textContent = provider.kind === 'openai' ? (provider.model || '') : '';
  $('curOllama').textContent = provider.kind === 'ollama' ? (provider.model || '') : '';
  const t = $('tagline');
  if (provider.kind === 'free') t.textContent = '当前：内置免费模型';
  else if (provider.kind === 'ollama') t.textContent = '当前：本地 Ollama · ' + (provider.model || '未选');
  else t.textContent = '当前：' + (provider.model || '自定义 API');
}

/* ---------- 初始化 ---------- */
fetch('/api/providers').then(r => r.json()).then(d => {
  presets = d.presets || [];
  const sel = $('presetSelect');
  presets.forEach(p => {
    const o = document.createElement('option');
    o.value = p.id; o.textContent = p.label;
    sel.appendChild(o);
  });
  if (d.free && d.free.label) $('curFree').textContent = d.free.label.replace('（内置免费）', '');
}).catch(() => {});
refreshBadge();
restoreHistory();

/* ---------- 面板开关 ---------- */
function openPop() {
  closeThreads();
  editing = Object.assign({}, provider);
  selectKind(editing.kind, true);
  $('baseUrl').value = editing.base_url || '';
  $('apiKey').value = editing.api_key || '';
  $('modelNameInput').value = editing.model || '';
  $('ollamaUrl').value = (editing.kind === 'ollama' && editing.base_url) || 'http://127.0.0.1:11434';
  setStatus('', true);
  pop.classList.add('on');
  profileBtn.classList.add('on');
}
function closePop() {
  pop.classList.remove('on');
  profileBtn.classList.remove('on');
}
profileBtn.onclick = e => { e.stopPropagation(); pop.classList.contains('on') ? closePop() : openPop(); };
$('closePop').onclick = closePop;
document.addEventListener('click', e => {
  if (pop.classList.contains('on') && !pop.contains(e.target) && !profileBtn.contains(e.target)) closePop();
  if (threadsPop.classList.contains('on') && !threadsPop.contains(e.target) && !threadsBtn.contains(e.target)) closeThreads();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closePop(); closeThreads(); }
});

/* ---------- 选择通道 ---------- */
function selectKind(kind, silent) {
  editing.kind = kind;
  document.querySelectorAll('.opt').forEach(o => o.classList.toggle('on', o.dataset.kind === kind));
  $('form-free').classList.toggle('hidden', kind !== 'free');
  $('form-openai').classList.toggle('hidden', kind !== 'openai');
  $('form-ollama').classList.toggle('hidden', kind !== 'ollama');
  if (!silent) setStatus('', true);
  if (kind === 'ollama' && $('ollamaModels').options.length <= 1) detectOllama();
}
document.querySelectorAll('.opt').forEach(o => o.onclick = () => selectKind(o.dataset.kind));

/* ---------- 预设与模型 ---------- */
$('presetSelect').onchange = e => {
  const p = presets.find(x => x.id === e.target.value);
  if (!p) { $('presetHint').textContent = ''; return; }
  $('baseUrl').value = p.base_url;
  $('presetHint').innerHTML = p.hint + (p.key_url ? ` · <a href="${p.key_url}" target="_blank" rel="noopener">申请 Key</a>` : '');
};

$('fetchModels').onclick = async () => {
  const base = $('baseUrl').value.trim();
  if (!base) return setStatus('先填接口地址', false);
  $('fetchModels').disabled = true;
  setStatus('拉取中…', true);
  try {
    const q = new URLSearchParams({ base_url: base, api_key: $('apiKey').value.trim() });
    const d = await (await fetch('/api/models?' + q)).json();
    if (!d.ok) return setStatus(d.error || '拉取失败', false);
    const sel = $('modelSelect');
    sel.innerHTML = '';
    d.models.forEach(m => {
      const o = document.createElement('option');
      o.value = m; o.textContent = m;
      sel.appendChild(o);
    });
    $('modelListWrap').classList.remove('hidden');
    if (d.models.length) {
      $('modelNameInput').value = d.models[0];
      setStatus(`找到 ${d.models.length} 个模型`, true);
    } else setStatus('没返回模型，手动填即可', false);
  } catch (err) {
    setStatus('请求失败：' + err.message, false);
  } finally {
    $('fetchModels').disabled = false;
  }
};
$('modelSelect').onchange = e => { $('modelNameInput').value = e.target.value; };

/* ---------- Ollama ---------- */
async function detectOllama() {
  const base = $('ollamaUrl').value.trim() || 'http://127.0.0.1:11434';
  $('detectOllama').disabled = true;
  setStatus('检测中…', true);
  try {
    const d = await (await fetch('/api/ollama/models?base_url=' + encodeURIComponent(base))).json();
    const sel = $('ollamaModels');
    sel.innerHTML = '';
    if (!d.ok) {
      sel.innerHTML = '<option value="">未检测到服务</option>';
      return setStatus('没检测到 Ollama，先安装并启动', false);
    }
    if (!d.models.length) {
      sel.innerHTML = '<option value="">没有已下载模型</option>';
      return setStatus('先执行：ollama pull qwen2.5:3b', false);
    }
    d.models.forEach(m => {
      const o = document.createElement('option');
      o.value = m; o.textContent = m;
      sel.appendChild(o);
    });
    setStatus(`检测到 ${d.models.length} 个模型`, true);
  } catch (err) {
    setStatus('检测失败：' + err.message, false);
  } finally {
    $('detectOllama').disabled = false;
  }
}
$('detectOllama').onclick = detectOllama;

/* ---------- 保存 ---------- */
$('saveBtn').onclick = () => {
  const kind = editing.kind;
  const next = { kind, base_url: '', api_key: '', model: '', temperature: 0.7 };

  if (kind === 'openai') {
    next.base_url = $('baseUrl').value.trim();
    next.api_key = $('apiKey').value.trim();
    next.model = $('modelNameInput').value.trim();
    if (!next.base_url) return setStatus('接口地址不能为空', false);
    if (!next.model) return setStatus('模型名不能为空', false);
    if (!next.api_key) return setStatus('API Key 不能为空', false);
  } else if (kind === 'ollama') {
    next.base_url = $('ollamaUrl').value.trim() || 'http://127.0.0.1:11434';
    next.model = $('ollamaModels').value;
    if (!next.model) return setStatus('先检测并选一个本地模型', false);
  }

  provider = next;
  localStorage.setItem('chat_provider', JSON.stringify(provider));
  refreshBadge();
  setStatus('已保存', true);
  setTimeout(closePop, 450);
};

function setStatus(text, ok) {
  statusMsg.textContent = text;
  statusMsg.className = 'status ' + (ok ? 'ok' : 'bad');
}

/* ---------- 消息 ---------- */
function addRow(role, text) {
  if ($('welcome')) $('welcome').remove();
  const row = document.createElement('div');
  row.className = 'row ' + (role === 'user' ? 'user' : 'ai');

  let av;
  if (role === 'user') {
    av = document.createElement('div');
    av.className = 'avatar me';
    av.textContent = '我';
  } else {
    av = document.createElement('div');
    av.className = 'avatar';
    const img = document.createElement('img');
    img.src = '/static/avatar.gif';
    img.alt = '小黍';
    av.appendChild(img);
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (text) bubble.textContent = text;

  row.appendChild(av); row.appendChild(bubble);
  wrap.appendChild(row);
  scrollToBottom();
  return bubble;
}
function scrollToBottom() {
  requestAnimationFrame(() => { main.scrollTop = main.scrollHeight; });
}

/* ---------- 会话渲染与切换 ---------- */
function paint(msgs) {
  wrap.innerHTML = '';
  if (!msgs || !msgs.length) {
    wrap.innerHTML = WELCOME_HTML;
    return;
  }
  msgs.forEach(m => addRow(m.role === 'user' ? 'user' : 'ai', m.content));
  scrollToBottom();
}

async function loadThread(id, andClose) {
  threadId = id;
  localStorage.setItem('chat_thread_id', id);
  try {
    const d = await (await fetch('/api/history/' + encodeURIComponent(id))).json();
    paint(d.messages || []);
  } catch (_) {
    paint([]);
  }
  if (andClose) closeThreads();
}

async function newThread() {
  try {
    const r = await fetch('/api/reset', { method: 'POST' });
    const d = await r.json();
    threadId = d.thread_id;
  } catch (_) {
    threadId = 'thread-' + Date.now() + '-' + Math.random().toString(16).slice(2);
  }
  localStorage.setItem('chat_thread_id', threadId);
  paint([]);
  input.focus();
}

/* 刷新或重新打开页面时，把这次会话的历史读回来 */
async function restoreHistory() {
  if (!threadId) return;
  try {
    const d = await (await fetch('/api/history/' + encodeURIComponent(threadId))).json();
    const msgs = d.messages || [];
    if (msgs.length) paint(msgs);
  } catch (_) { /* 拿不到就保持欢迎页，不影响使用 */ }
}

function relTime(ts) {
  const diff = Date.now() / 1000 - (ts || 0);
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
  if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
  if (diff < 86400 * 7) return Math.floor(diff / 86400) + ' 天前';
  const d = new Date((ts || 0) * 1000);
  return (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日';
}

/* ---------- 会话列表面板 ---------- */
function closeThreads() {
  threadsPop.classList.remove('on');
  threadsBtn.classList.remove('on');
}

async function openThreads() {
  closePop();
  threadsPop.classList.add('on');
  threadsBtn.classList.add('on');
  const box = $('threadList');
  box.innerHTML = '<div class="empty">加载中…</div>';
  try {
    const d = await (await fetch('/api/threads')).json();
    const list = d.threads || [];
    if (!list.length) {
      box.innerHTML = '<div class="empty">还没有会话记录</div>';
      return;
    }
    box.innerHTML = '';
    list.forEach(t => {
      const item = document.createElement('div');
      item.className = 'thread-item' + (t.thread_id === threadId ? ' active' : '');

      const txt = document.createElement('div');
      txt.className = 't-txt';
      const ti = document.createElement('span');
      ti.className = 't-title';
      ti.textContent = t.title || '新对话';
      const tm = document.createElement('span');
      tm.className = 't-time';
      tm.textContent = relTime(t.updated_at);
      txt.appendChild(ti);
      txt.appendChild(tm);

      const del = document.createElement('button');
      del.className = 't-del';
      del.textContent = '×';
      del.title = '删除这个会话';
      del.onclick = async ev => {
        ev.stopPropagation();
        if (!confirm('删除这个会话？聊天记录不可恢复。')) return;
        await fetch('/api/threads/' + encodeURIComponent(t.thread_id), { method: 'DELETE' });
        if (t.thread_id === threadId) await newThread();
        openThreads();
      };

      item.appendChild(txt);
      item.appendChild(del);
      item.onclick = () => loadThread(t.thread_id, true);
      box.appendChild(item);
    });
  } catch (err) {
    box.innerHTML = '<div class="empty">加载失败：' + err.message + '</div>';
  }
}

threadsBtn.onclick = e => {
  e.stopPropagation();
  threadsPop.classList.contains('on') ? closeThreads() : openThreads();
};
$('closeThreads').onclick = closeThreads;
function showError(bubble, message) {
  bubble.classList.add('err');
  bubble.textContent = message;
  const btn = document.createElement('button');
  btn.className = 'link';
  btn.textContent = '打开设置';
  btn.onclick = openPop;
  bubble.appendChild(document.createElement('br'));
  bubble.appendChild(btn);
}

/* ---------- 发送 ---------- */
async function send(text) {
  text = (text || '').trim();
  if (!text || busy) return;

  busy = true;
  sendBtn.disabled = true;
  input.value = '';
  input.style.height = 'auto';
  addRow('user', text);

  const bubble = addRow('ai', '');
  bubble.innerHTML = '<div class="thinking"><i></i><i></i><i></i></div>';

  let answer = '', started = false;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, thread_id: threadId, provider })
    });
    if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      const frames = buf.split('\n\n');
      buf = frames.pop();

      for (const frame of frames) {
        const line = frame.trim();
        if (!line.startsWith('data:')) continue;
        let p;
        try { p = JSON.parse(line.slice(5).trim()); } catch { continue; }

        if (p.type === 'delta') {
          if (!started) { bubble.textContent = ''; started = true; }
          answer += p.content;
          bubble.textContent = answer;
          bubble.appendChild(Object.assign(document.createElement('span'), { className: 'cursor' }));
          scrollToBottom();
        } else if (p.type === 'error') {
          showError(bubble, p.message || '未知错误');
          started = true;
        }
      }
    }

    if (!started) bubble.textContent = '（没有返回内容，换个模型试试）';
    else if (answer) bubble.textContent = answer;

  } catch (e) {
    showError(bubble, '请求失败：' + e.message);
  } finally {
    busy = false;
    sendBtn.disabled = false;
    scrollToBottom();
    input.focus();
  }
}

/* ---------- 交互 ---------- */
sendBtn.onclick = () => send(input.value);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    send(input.value);
  }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 150) + 'px';
});
// 欢迎页的示例问题用事件委托，避免重绘后丢绑定
wrap.addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (chip) send(chip.textContent);
});

$('resetBtn').onclick = () => {
  if (busy) return;
  newThread();
};

input.focus();
</script>
